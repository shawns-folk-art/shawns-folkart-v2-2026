    <script language="javascript" type="text/javascript">
      (function () {
        var currentUrl = window.location.href;
        var wrapperUrl = new URL("index.html", currentUrl);

        if (window.top === window.self) {
          if (
            window.location.pathname.toLowerCase() !==
            wrapperUrl.pathname.toLowerCase()
          ) {
            window.location.replace(wrapperUrl.href);
          }
          return;
        }

        var topUrl;
        try {
          topUrl = new URL(window.top.location.href);
        } catch (error) {
          if (!error || error.name !== "SecurityError") {
            throw error;
          }
          window.top.location = currentUrl;
          return;
        }

        if (
          topUrl.origin !== wrapperUrl.origin ||
          topUrl.pathname.toLowerCase() !== wrapperUrl.pathname.toLowerCase()
        ) {
          window.top.location.replace(currentUrl);
        }
      })();
    </script>

    <script language="javascript" type="text/javascript">
      function loadatune() {
        /* eja: removed old random music generator - random programming now in actionscript */
        let x = parseInt(Math.random() * 10);

        if (x < 5) {
          parent.frames[0].document.location.href = "../music.htm";
        } else {
          parent.frames[0].document.location.href = "../music2.htm";
        }

        parent.frames[0].document.location.href = "../music3.htm";
      }
    </script>
    <script language="JavaScript" type="text/javascript">
      function runcenter(url, name, height, width) {
        var str = "height=" + height + ",innerHeight=" + height;
        str += ",width=" + width + ",innerWidth=" + width;
        if (url === "../video1/index1.htm" || url === "../video2/index1.htm") {
          // Browsers choose which security/address UI must remain visible.
          str += ",popup=yes,toolbar=no,menubar=no,location=no,status=no";
          str += ",scrollbars=no,resizable=yes";
        }
        if (window.screen) {
          var ah = screen.availHeight - 50;
          var aw = screen.availWidth - 10;

          var xc = (aw - width) / 2;
          var yc = (ah - height) / 2;

          str += ",left=" + xc + ",screenX=" + xc;
          str += ",top=" + yc + ",screenY=" + yc;
        }
        newwindow = window.open(url, name, str);
      }
    </script>
