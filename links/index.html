      function loadwindow(URLtoLoad) {
        //v3.0
        myWidth = 600;
        myHeight = 400;
        isCenter = true;
        features = "scrollbars=yes,status=no,location=yes,resizable=yes";
        if (window.screen)
          if (isCenter)
            if (isCenter == "true") {
              var myLeft = (screen.width - myWidth) / 2;
              var myTop = (screen.height - myHeight) / 2;
              features += features != "" ? "," : "";
              features += ",left=" + myLeft + ",top=" + myTop;
            }
        window.open(
          URLtoLoad,
          "linkwindow",
          features +
            (features != "" ? "," : "") +
            "width=" +
            myWidth +
            ",height=" +
            myHeight,
        );
      }
    </script>
