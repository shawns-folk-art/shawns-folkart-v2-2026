    <script language="javascript" type="text/javascript">
      // Randomly choose a page other than the previous selection.
      const pages = ["index-01.html", "index-02.html", "index-03.html"];
      const storageKey = "shawnsfolkart:lastLandingPage";
      let lastPage = null;

      try {
        lastPage = localStorage.getItem(storageKey);
      } catch (error) {
        // Continue redirecting if browser storage is unavailable.
      }

      const choices = pages.filter((page) => page !== lastPage);
      const nextPage = choices[Math.floor(Math.random() * choices.length)];

      try {
        localStorage.setItem(storageKey, nextPage);
      } catch (error) {
        // Without storage, consecutive repeats cannot be prevented.
      }

      window.location.replace(nextPage);
    </script>
