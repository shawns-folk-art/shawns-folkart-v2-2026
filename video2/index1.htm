<head>
  <title>Shawn's Folk Art 2026 :: The Videos</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

    content="touchwood, design, folk art, shawn murenbeeld., ed apostol, tony lei, puneet sethi, vince kwok, jacqueline sit, canada, wood, art, touchwooddesign.com, flash, artwork, driftwood">

    content="Welcome to the folk art site of Shawn Murenbeeld, owner, principal of touchwooddesign.com. In conjunction with Ed Apostol & Associates, this site was built to promote the artwork developed by Shawn and raise awareness of Canadian folk art around the world.">

  <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png" />
  <link rel="manifest" href="../favicon/site.webmanifest" />
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var video = document.querySelector("video");
      // Touch devices retain native controls. Without JavaScript they do too.
      var hover = window.matchMedia("(hover: hover) and (pointer: fine)");
      var pointerInside = false;
      var keyboardActive = false;

      function updateControls() {
        video.controls = !hover.matches || pointerInside || keyboardActive;
      }

      document.documentElement.addEventListener("pointerenter", function () {
        pointerInside = true;
        updateControls();
      });
      document.documentElement.addEventListener("pointerleave", function () {
        pointerInside = false;
        keyboardActive = false;
        updateControls();
      });
      document.addEventListener("keydown", function () {
        keyboardActive = true;
        updateControls();
      });
      window.addEventListener("blur", function () {
        pointerInside = false;
        keyboardActive = false;
        updateControls();
      });
      hover.addEventListener("change", updateControls);
      updateControls();
    });
  </script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    video {
      display: block;
      width: 240px;
      max-width: 100%;
      max-height: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <video controls playsinline preload="metadata" aria-label="Folk Art Show 2002 video">

    Your browser does not support HTML video.
    <a href="folkartshow2002.mp4">Download the video</a>
  </video>
</body>

</html>
