<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<!-- @format -->

<html lang="en">
  <head>
    <title>Flash variables translator</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="../favicon/site.webmanifest" />
    <script>
      function translate1() {
        theString = document.forms["theForm"].input.value + " ";
        theOutput = "";

        theStr = theString.split("\n");

        for (i = 0; i < theStr.length; i++) {
          theStr[i] = theStr[i].substring(0, theStr[i].length - 1);
          theStr[i] = escape(theStr[i]);
          theOutput += theStr[i] + "&";
          theOutput = theOutput.replace("%3D", "=");
        }

        document.forms["theForm"].output.value = theOutput;
      }

      function translate2() {
        theString = document.forms["theForm"].input.value + " ";
        theOutput = "";

        theStr = theString.split("&");

        for (i = 0; i < theStr.length; i++) {
          theStr[i] = theStr[i].replace("=", "%3D");
          theStr[i] = unescape(theStr[i]);
          theOutput += theStr[i] + "\n";
        }

        document.forms["theForm"].output.value = theOutput;
      }
    </script>
    <style type="text/css">
      p {  font-family: Verdana, Arial, Helvetica, sans-serif; font-size: 12px}

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body
    bgcolor="#3C4586"
    text="#FFFFFF"
    link="#FFFFFF"
    vlink="#FFFFFF"
    alink="#FFFFFF"
  >
    <table width="100%" border="0" cellspacing="0" cellpadding="0" height="500">
      <tr>
        <td>
          <table
            width="500"
            border="0"
            cellspacing="0"
            cellpadding="0"
            align="center"
          >
            <tr>
              <td>
                <form name="theForm">
                  <p style="font-size: 16px">
                    <b
                      ><br />
                      Flash variables translator</b
                    >
                  </p>
                  <p>
                    <b><label for="translator-input">Enter your variables</label></b>, then choose your translation
                    below. <br />
                    The result appears in the bottom window.
                    <br />
                    <br />
                    <font size="2" face="Verdana, Arial, Helvetica, sans-serif">
                      <textarea
                        name="input"
                        id="translator-input"
                        cols="70"
                        rows="15"
                        style="
                          font-family: Verdana, Arial, Helvetica, sans-serif;
                          font-size: 12px;
                          color: #3c4586;
                        "
                      ></textarea>
                    </font>
                  </p>
                  <p>
                    <b>Translate</b>:
                    <a href="javascript:translate1()">English to Flash</a> |
                    <a href="javascript:translate2()">Flash to English</a>
                  </p>
                  <p>
                    <label for="translator-output" class="visually-hidden">Translation result</label>
                    <font size="2" face="Verdana, Arial, Helvetica, sans-serif">
                      <textarea
                        name="output"
                        id="translator-output"
                        cols="70"
                        rows="15"
                        style="
                          font-family: Verdana, Arial, Helvetica, sans-serif;
                          font-size: 12px;
                          color: #3c4586;
                        "
                      ></textarea>
                    </font>
                  </p>
                  <p>
                    For regular updates and more useful Web design tools, keep
                    an eye on
                    <b
                      ><a href="http://www.computerarts.co.uk/web"
                        >www.computerarts.co.uk/web</a
                      ></b
                    >
                  </p>
                </form>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
